<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 Restaurant Order Manager</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce { animation: bounce 1s infinite; }
        
        /* --- IMPROVED DARK MODE STYLES FOR BETTER READABILITY --- */
        .dark { background-color: #121212; color: #f3f4f6; }
        .dark .bg-white { background-color: #1e1e1e; }
        .dark .bg-gray-50 { background-color: #27272a; }
        .dark .bg-gray-100 { background-color: #3f3f46; }
        .dark .bg-gray-200 { background-color: #525252; }
        .dark .text-gray-800 { color: #f3f4f6; }
        .dark .text-gray-700 { color: #e5e7eb; }
        .dark .text-gray-600 { color: #d1d5db; }
        .dark .text-gray-500 { color: #9ca3af; } /* Fixed: was too dark (#737373) */
        .dark .text-gray-400 { color: #9ca3af; } /* Fixed: was nearly invisible (#525252) */
        .dark .text-gray-300 { color: #d1d5db; }
        .dark .text-gray-200 { color: #e5e7eb; }
        .dark .border-gray-50 { border-color: #27272a; }
        .dark .border-gray-100 { border-color: #3f3f46; }
        .dark .border-gray-200 { border-color: #525252; }
        .dark .border-gray-300 { border-color: #71717a; }
        .dark .border-gray-600 { border-color: #525252; }
        .dark .border-gray-700 { border-color: #3f3f46; }
        .dark .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.5); }
        
        /* Dark mode badge fixes */
        .dark .bg-green-100 { background-color: #064e3b; }
        .dark .text-green-700 { color: #6ee7b7; }
        .dark .bg-blue-100 { background-color: #1e3a8a; }
        .dark .text-blue-700 { color: #93c5fd; }
        .dark .bg-yellow-100 { background-color: #422006; }
        .dark .text-yellow-700 { color: #fde047; }
        .dark .bg-red-100 { background-color: #450a0a; }
        .dark .text-red-700 { color: #fca5a5; }
        .dark .bg-orange-100 { background-color: #431407; }
        .dark .text-orange-600 { color: #fdba74; }
        .dark .bg-amber-50 { background-color: #451a03; }
        .dark .border-amber-200 { border-color: #78350f; }
        .dark .text-amber-800 { color: #fcd34d; }
        .dark .text-amber-700 { color: #fde68a; }
        
        /* Floating emoji animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-5deg); }
        }
        @keyframes floatDiag {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            50% { transform: translate(10px, -15px) rotate(8deg); }
        }
        .floating-emoji {
            position: absolute;
            opacity: 0.18;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }
        .dark .floating-emoji {
            opacity: 0.10; /* Slightly more subtle in dark mode */
        }
        .float-1 { animation: float 6s ease-in-out infinite; }
        .float-2 { animation: floatSlow 8s ease-in-out infinite; }
        .float-3 { animation: float 7s ease-in-out infinite 1s; }
        .float-4 { animation: floatSlow 9s ease-in-out infinite 2s; }
        .float-5 { animation: floatDiag 7s ease-in-out infinite 0.5s; }
        .float-6 { animation: floatDiag 10s ease-in-out infinite 1.5s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // ==========================================================
        // 🔗 PASTE YOUR DEFAULT GOOGLE SHEET WEB APP URL HERE
        // This will pre-fill the settings so you don't have to 
        // update it in every session. It still saves to IndexedDB.
        // ==========================================================
        const DEFAULT_GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzdHtTcOd6MB_k7abfxBHLzT0E-VYdfrQbDJ3gEsXVyXTWYzCXuRHumw8UFxF1q2MMp/exec'; 

        // Theme Context
        const ThemeContext = createContext();
        const useTheme = () => useContext(ThemeContext);

        // Floating Background Emojis Component
        const FloatingBackground = () => {
            const emojis = ['🍕', '🍔', '🌯', '🍟', '🥤', '🧀', '🥗', '☕', '🧆', '🍗', '🍕', '🍔', '🌯', '🍟', '🥤', '🧀', '🥗', '☕', '🧆', '🍗', '🍕', '🍔', '🌯', '🍟', '🥤'];
            const positions = [
                { top: '5%', left: '3%', size: '4.5rem', delay: '0s' },
                { top: '12%', right: '5%', size: '4rem', delay: '1s' },
                { top: '25%', left: '8%', size: '3.5rem', delay: '2s' },
                { top: '35%', right: '10%', size: '5rem', delay: '0.5s' },
                { top: '45%', left: '12%', size: '4rem', delay: '1.5s' },
                { top: '55%', right: '7%', size: '3.5rem', delay: '2.5s' },
                { top: '65%', left: '5%', size: '4.5rem', delay: '0.8s' },
                { top: '75%', right: '12%', size: '4rem', delay: '1.8s' },
                { top: '85%', left: '10%', size: '3.5rem', delay: '2.2s' },
                { top: '15%', left: '45%', size: '4rem', delay: '0.3s' },
                { top: '30%', left: '70%', size: '3.5rem', delay: '1.2s' },
                { top: '50%', left: '25%', size: '4.5rem', delay: '2.8s' },
                { top: '70%', left: '55%', size: '4rem', delay: '0.7s' },
                { top: '90%', left: '35%', size: '3.5rem', delay: '1.7s' },
                { top: '8%', left: '25%', size: '4rem', delay: '2.3s' },
                { top: '20%', left: '60%', size: '3.5rem', delay: '0.4s' },
                { top: '40%', left: '85%', size: '4.5rem', delay: '1.4s' },
                { top: '60%', left: '40%', size: '4rem', delay: '2.4s' },
                { top: '80%', left: '75%', size: '3.5rem', delay: '0.9s' },
                { top: '95%', left: '15%', size: '4rem', delay: '1.9s' },
                { top: '18%', left: '80%', size: '3.5rem', delay: '2.6s' },
                { top: '38%', left: '18%', size: '4.5rem', delay: '0.6s' },
                { top: '58%', left: '65%', size: '4rem', delay: '1.6s' },
                { top: '78%', left: '30%', size: '3.5rem', delay: '2.7s' },
                { top: '48%', left: '92%', size: '4rem', delay: '1.1s' },
            ];

            return (
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                    {positions.map((pos, i) => (
                        <div
                            key={i}
                            className={`floating-emoji float-${(i % 6) + 1}`}
                            style={{
                                top: pos.top,
                                left: pos.left,
                                right: pos.right,
                                fontSize: pos.size,
                                animationDelay: pos.delay
                            }}
                        >
                            {emojis[i % emojis.length]}
                        </div>
                    ))}
                </div>
            );
        };

        // Database (IndexedDB)
        const db = {
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('RestaurantDB', 2);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const database = event.target.result;
                        if (!database.objectStoreNames.contains('orders')) {
                            database.createObjectStore('orders', { keyPath: 'id', autoIncrement: true });
                        }
                        if (!database.objectStoreNames.contains('settings')) {
                            database.createObjectStore('settings', { keyPath: 'id' });
                        }
                        if (!database.objectStoreNames.contains('menuItems')) {
                            database.createObjectStore('menuItems', { keyPath: 'id' });
                        }
                    };
                });
            },
            async addOrder(order) {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['orders'], 'readwrite');
                    const store = transaction.objectStore('orders');
                    const request = store.add(order);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            async getOrders() {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['orders'], 'readonly');
                    const store = transaction.objectStore('orders');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            async updateOrder(id, updates) {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['orders'], 'readwrite');
                    const store = transaction.objectStore('orders');
                    const getRequest = store.get(id);
                    getRequest.onsuccess = () => {
                        const order = { ...getRequest.result, ...updates };
                        if (updates.status && updates.status !== getRequest.result.status) {
                            order.synced = false;
                            order.statusChanged = true;
                            order.lastStatus = getRequest.result.status;
                        }
                        const updateRequest = store.put(order);
                        updateRequest.onsuccess = () => resolve();
                        updateRequest.onerror = () => reject(updateRequest.error);
                    };
                });
            },
            async getSettings() {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['settings'], 'readonly');
                    const store = transaction.objectStore('settings');
                    const request = store.get('main');
                    request.onsuccess = () => resolve(request.result || { 
                        id: 'main', 
                        googleSheetUrl: DEFAULT_GOOGLE_SHEET_URL, // Pre-filled default
                        restaurantName: 'Restaurant', 
                        currency: '$' 
                    });
                    request.onerror = () => reject(request.error);
                });
            },
            async saveSettings(settings) {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['settings'], 'readwrite');
                    const store = transaction.objectStore('settings');
                    const request = store.put({ ...settings, id: 'main' });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            async getMenuItems() {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['menuItems'], 'readonly');
                    const store = transaction.objectStore('menuItems');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            async saveMenuItem(item) {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['menuItems'], 'readwrite');
                    const store = transaction.objectStore('menuItems');
                    const request = store.put(item);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            async deleteMenuItem(id) {
                const database = await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = database.transaction(['menuItems'], 'readwrite');
                    const store = transaction.objectStore('menuItems');
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            async initializeMenuItems(defaultItems) {
                const existing = await this.getMenuItems();
                if (existing.length === 0) {
                    for (const item of defaultItems) {
                        await this.saveMenuItem(item);
                    }
                }
            }
        };

        // Default Menu Data (used for initialization)
        const defaultMenuItems = [
            { id: 'pizza-margherita', name: 'Margherita', category: 'pizza', price: 8.99, emoji: '🍕', variants: [{ name: 'Small', price: 8.99 }, { name: 'Medium', price: 11.99 }, { name: 'Large', price: 14.99 }] },
            { id: 'pizza-pepperoni', name: 'Pepperoni', category: 'pizza', price: 10.99, emoji: '🍕', variants: [{ name: 'Small', price: 10.99 }, { name: 'Medium', price: 13.99 }, { name: 'Large', price: 16.99 }] },
            { id: 'pizza-veggie', name: 'Veggie Supreme', category: 'pizza', price: 9.99, emoji: '🥬', variants: [{ name: 'Small', price: 9.99 }, { name: 'Medium', price: 12.99 }, { name: 'Large', price: 15.99 }] },
            { id: 'pizza-bbq-chicken', name: 'BBQ Chicken', category: 'pizza', price: 11.99, emoji: '🍗', variants: [{ name: 'Small', price: 11.99 }, { name: 'Medium', price: 14.99 }, { name: 'Large', price: 17.99 }] },
            { id: 'burger-classic', name: 'Classic Burger', category: 'burger', price: 7.99, emoji: '🍔' },
            { id: 'burger-cheese', name: 'Cheese Burger', category: 'burger', price: 8.99, emoji: '🧀' },
            { id: 'burger-chicken', name: 'Chicken Burger', category: 'burger', price: 8.49, emoji: '🍔' },
            { id: 'burger-double', name: 'Double Smash', category: 'burger', price: 11.99, emoji: '🔥' },
            { id: 'shawarma-chicken', name: 'Chicken Shawarma', category: 'shawarma', price: 6.99, emoji: '🌯', variants: [{ name: 'Wrap', price: 6.99 }, { name: 'Plate', price: 9.99 }] },
            { id: 'shawarma-meat', name: 'Meat Shawarma', category: 'shawarma', price: 7.99, emoji: '🌯', variants: [{ name: 'Wrap', price: 7.99 }, { name: 'Plate', price: 10.99 }] },
            { id: 'shawarma-falafel', name: 'Falafel Shawarma', category: 'shawarma', price: 5.99, emoji: '🧆', variants: [{ name: 'Wrap', price: 5.99 }, { name: 'Plate', price: 8.99 }] },
            { id: 'fries', name: 'French Fries', category: 'sides', price: 3.49, emoji: '🍟' },
            { id: 'onion-rings', name: 'Onion Rings', category: 'sides', price: 4.49, emoji: '🧅' },
            { id: 'salad', name: 'Fresh Salad', category: 'sides', price: 4.99, emoji: '🥗' },
            { id: 'garlic-bread', name: 'Garlic Bread', category: 'sides', price: 3.99, emoji: '🧄' },
            { id: 'cola', name: 'Cola', category: 'drinks', price: 1.99, emoji: '🥤' },
            { id: 'juice', name: 'Fresh Juice', category: 'drinks', price: 3.49, emoji: '🧃' },
            { id: 'water', name: 'Water', category: 'drinks', price: 0.99, emoji: '💧' },
            { id: 'coffee', name: 'Coffee', category: 'drinks', price: 2.49, emoji: '☕' },
        ];

        const categories = [
            { id: 'all', name: 'All', emoji: '📋' },
            { id: 'pizza', name: 'Pizza', emoji: '🍕' },
            { id: 'burger', name: 'Burgers', emoji: '🍔' },
            { id: 'shawarma', name: 'Shawarma', emoji: '🌯' },
            { id: 'sides', name: 'Sides', emoji: '🍟' },
            { id: 'drinks', name: 'Drinks', emoji: '🥤' },
        ];

        // Sound Effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, duration, type = 'sine', volume = 0.3) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioContext.currentTime);
            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        };
        const sounds = {
            click: () => playTone(800, 0.05, 'sine', 0.1),
            add: () => { playTone(523, 0.1); setTimeout(() => playTone(659, 0.1), 50); },
            remove: () => { playTone(400, 0.1); setTimeout(() => playTone(300, 0.15), 50); },
            order: () => { playTone(523, 0.15); setTimeout(() => playTone(659, 0.15), 100); setTimeout(() => playTone(784, 0.2), 200); },
            sync: () => { playTone(880, 0.1); setTimeout(() => playTone(1100, 0.15), 80); }
        };

        // Sync to Google Sheets
        const syncOrders = async () => {
            const settings = await db.getSettings();
            if (!settings.googleSheetUrl || settings.googleSheetUrl.includes('YOUR_DEFAULT_SCRIPT_ID')) return { synced: 0, failed: 0 };
            
            const orders = await db.getOrders();
            const unsynced = orders.filter(o => !o.synced);
            let synced = 0, failed = 0;

            for (const order of unsynced) {
                try {
                    const shouldSend = !order.lastSyncedStatus || order.lastSyncedStatus !== order.status;
                    if (shouldSend) {
                        await fetch(settings.googleSheetUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                orderId: order.orderId,
                                timestamp: order.createdAt,
                                customerName: order.customerName,
                                customerPhone: order.customerPhone,
                                orderType: order.orderType,
                                tableNumber: order.tableNumber || '',
                                items: order.items.map(i => `${i.menuItem.emoji} ${i.menuItem.name}${i.variant ? ` (${i.variant})` : ''} x${i.quantity}`).join(', '),
                                total: order.total,
                                notes: order.notes,
                                status: order.status,
                                createdBy: order.createdBy
                            })
                        });
                    }
                    await db.updateOrder(order.id, { 
                        synced: true, 
                        lastSyncedStatus: order.status,
                        statusChanged: false
                    });
                    synced++;
                } catch (e) {
                    failed++;
                }
            }
            if (synced > 0) sounds.sync();
            return { synced, failed };
        };

        // Components
        const NameEntry = ({ onSubmit }) => {
            const [name, setName] = useState('');
            const { darkMode, toggleDarkMode } = useTheme();
            return (
                <div className={`min-h-screen flex items-center justify-center p-4 relative ${darkMode ? 'bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900' : 'bg-gradient-to-br from-orange-50 via-amber-50 to-yellow-50'}`}>
                    <FloatingBackground />
                    <button
                        onClick={toggleDarkMode}
                        className="absolute top-4 right-4 p-3 rounded-full bg-white/80 dark:bg-gray-800/80 shadow-lg hover:scale-110 transition-transform z-10"
                        title="Toggle dark mode"
                    >
                        {darkMode ? '☀️' : '🌙'}
                    </button>
                    <div className={`rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full text-center relative z-10 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                        <div className="text-6xl mb-4 animate-bounce">🍽️</div>
                        <h1 className={`text-3xl font-bold mb-2 ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>Welcome!</h1>
                        <p className={`mb-8 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Enter your name to start taking orders</p>
                        <form onSubmit={(e) => { e.preventDefault(); if (name.trim()) { sounds.click(); onSubmit(name.trim()); } }}>
                            <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Your name..." className={`w-full px-4 py-4 text-lg border-2 rounded-2xl focus:border-orange-400 outline-none ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'border-gray-200 text-gray-800'}`} autoFocus />
                            <button type="submit" disabled={!name.trim()} className="w-full mt-6 py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white text-lg font-bold rounded-2xl disabled:opacity-50 hover:from-orange-600 hover:to-amber-600 transition-all">🚀 Start Taking Orders</button>
                        </form>
                        <p className={`mt-8 text-sm ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>💡 Admin? Add <code className={`px-2 py-1 rounded ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}>?ref=Admin</code> to the URL</p>
                    </div>
                </div>
            );
        };

        const OrderTaking = ({ userName, isAdmin, menuItems, onViewHistory, onViewDashboard, onViewSettings, onViewMenu }) => {
            const { darkMode, toggleDarkMode } = useTheme();
            const [cart, setCart] = useState([]);
            const [activeCategory, setActiveCategory] = useState('all');
            const [showCart, setShowCart] = useState(false);
            const [showCheckout, setShowCheckout] = useState(false);
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedVariant, setSelectedVariant] = useState('');
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [orderType, setOrderType] = useState('dine-in');
            const [tableNumber, setTableNumber] = useState('');
            const [orderNotes, setOrderNotes] = useState('');
            const [successMessage, setSuccessMessage] = useState('');
            const [online, setOnline] = useState(navigator.onLine);
            const [activeOrders, setActiveOrders] = useState([]);
            const [showActiveOrders, setShowActiveOrders] = useState(false);

            useEffect(() => {
                const handleOnline = () => setOnline(true);
                const handleOffline = () => setOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                loadActiveOrders();
                const interval = setInterval(loadActiveOrders, 5000);
                return () => { 
                    window.removeEventListener('online', handleOnline); 
                    window.removeEventListener('offline', handleOffline);
                    clearInterval(interval);
                };
            }, []);

            const loadActiveOrders = async () => {
                const orders = await db.getOrders();
                const today = new Date().toISOString().split('T')[0];
                const active = orders
                    .filter(o => o.createdAt.startsWith(today) && o.status !== 'delivered')
                    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                setActiveOrders(active);
            };

            const updateOrderStatus = async (orderId, newStatus) => {
                sounds.click();
                const order = activeOrders.find(o => o.id === orderId);
                if (!order) return;

                const statusOrder = ['pending', 'preparing', 'ready', 'delivered'];
                const currentIndex = statusOrder.indexOf(order.status);
                const newIndex = statusOrder.indexOf(newStatus);

                if (!isAdmin && newIndex <= currentIndex) {
                    alert('⚠️ You can only advance order status, not revert it.');
                    return;
                }

                await db.updateOrder(orderId, { status: newStatus });
                sounds.sync();
                await loadActiveOrders();
            };

            const filteredItems = activeCategory === 'all' ? menuItems : menuItems.filter(item => item.category === activeCategory);
            const handleItemClick = (item) => {
                sounds.click();
                if (item.variants && item.variants.length > 0) {
                    setSelectedItem(item);
                    setSelectedVariant(item.variants[0].name);
                } else {
                    addToCart(item);
                }
            };
            const addToCart = (item, variant) => {
                sounds.add();
                setCart(prev => {
                    const existing = prev.find(c => c.menuItem.id === item.id && c.variant === variant);
                    if (existing) return prev.map(c => c.menuItem.id === item.id && c.variant === variant ? { ...c, quantity: c.quantity + 1 } : c);
                    return [...prev, { menuItem: item, quantity: 1, variant }];
                });
                setSelectedItem(null);
            };
            const removeFromCart = (index) => { sounds.remove(); setCart(prev => prev.filter((_, i) => i !== index)); };
            const updateQuantity = (index, delta) => {
                sounds.click();
                setCart(prev => prev.map((item, i) => i === index ? { ...item, quantity: Math.max(1, item.quantity + delta) } : item));
            };
            const getItemPrice = (item) => item.variant && item.menuItem.variants ? item.menuItem.variants.find(v => v.name === item.variant)?.price || item.menuItem.price : item.menuItem.price;
            const cartTotal = cart.reduce((sum, item) => sum + getItemPrice(item) * item.quantity, 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            const handleSubmitOrder = async () => {

                const today = new Date().toISOString().split('T')[0];
                const orders = await db.getOrders();
                const todayOrders = orders.filter(o => o.createdAt.startsWith(today));
                const orderId = `ORD-${today.replace(/-/g, '')}-${String(todayOrders.length + 1).padStart(3, '0')}`;
                
                await db.addOrder({
                    orderId, customerName: customerName || 'Walk-in', customerPhone, orderType,
                    tableNumber: orderType === 'dine-in' ? tableNumber : undefined,
                    items: cart, total: cartTotal, notes: orderNotes, status: 'pending',
                    createdBy: userName, createdAt: new Date().toISOString(), synced: false
                });
                sounds.order();
                setSuccessMessage(`✅ Order ${orderId} placed successfully!`);

                                <div><h1 className={`font-bold text-lg ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>Order Manager</h1><p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>👤 {userName}</p></div>
                            </div>

                                <button

                                    {darkMode ? '☀️' : '🌙'}

                                <span className={`px-3 py-1 rounded-full text-xs font-medium ${online ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{online ? '🟢 Online' : '🔴 Offline'}</span>
                                {cartCount > 0 && <button onClick={() => { sounds.click(); setShowCart(true); }} className="relative bg-orange-500 text-white px-4 py-2 rounded-xl font-medium">🛒 Cart<span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">{cartCount}</span></button>}
                                {isAdmin && <div className="flex gap-1 ml-2"><button onClick={onViewDashboard} className={`p-2 rounded-lg ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`} title="Dashboard">📊</button><button onClick={onViewHistory} className={`p-2 rounded-lg ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`} title="Order History">📋</button><button onClick={onViewMenu} className={`p-2 rounded-lg ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`} title="Menu Management">🍽️</button><button onClick={onViewSettings} className={`p-2 rounded-lg ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`} title="Settings">⚙️</button></div>}
                            </div>
                        </div>
                    </header>
                    {successMessage && <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg animate-bounce">{successMessage}</div>}
                    <div className={`border-b sticky top-[68px] z-20 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>
                        <div className="max-w-7xl mx-auto px-4 py-2 flex gap-2 overflow-x-auto scrollbar-hide relative z-10">
                            {categories.map(cat => <button key={cat.id} onClick={() => { sounds.click(); setActiveCategory(cat.id); }} className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap ${activeCategory === cat.id ? 'bg-orange-500 text-white' : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-600'}`}><span>{cat.emoji}</span><span>{cat.name}</span></button>)}
                        </div>
                    </div>
                    <main className="flex-1 max-w-7xl mx-auto w-full px-4 py-6 relative z-10">
                        {activeOrders.length > 0 && (
                            <div className="mb-4">
                                <button 
                                    onClick={() => { sounds.click(); setShowActiveOrders(!showActiveOrders); }}
                                    className={`w-full rounded-2xl p-4 shadow-sm border flex items-center justify-between hover:shadow-md transition-all ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}
                                >
                                    <div className="flex items-center gap-3">
                                        <span className="text-2xl">🔥</span>
                                        <div className="text-left">
                                            <h3 className={`font-bold ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>Active Orders</h3>
                                            <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>{activeOrders.length} order{activeOrders.length !== 1 ? 's' : ''} in progress</p>
                                        </div>
                                    </div>
                                    <span className={`text-2xl ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>{showActiveOrders ? '▲' : '▼'}</span>
                                </button>
                                
                                {showActiveOrders && (
                                    <div className="mt-3 space-y-3">
                                        {activeOrders.map(order => {
                                            const statusColors = { pending: 'bg-yellow-100 text-yellow-700 border-yellow-300', preparing: 'bg-blue-100 text-blue-700 border-blue-300', ready: 'bg-green-100 text-green-700 border-green-300', cancelled: 'bg-red-100 text-red-700 border-red-300' };
                                            const statusEmojis = { pending: '⏳', preparing: '👨‍🍳', ready: '✅', cancelled: '❌' };
                                            const nextStatus = { pending: 'preparing', preparing: 'ready', ready: 'delivered' };
                                            
                                            return (
                                                <div key={order.id} className={`rounded-xl p-4 shadow-sm border ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}>

                                                        <div>
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <span className={`font-bold text-sm ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{order.orderId}</span>
                                                                <span className={`px-2 py-0.5 rounded-full text-xs font-medium border ${statusColors[order.status]}`}>
                                                                    {statusEmojis[order.status]} {order.status}
                                                                </span>
                                                            </div>
                                                            <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                                                👤 {order.customerName} • {order.orderType}

                                                            </p>
                                                        </div>
                                                        <span className="font-bold text-orange-600">${order.total.toFixed(2)}</span>
                                                    </div>
                                                    
                                                    <div className={`rounded-lg p-2 mb-3 ${darkMode ? 'bg-gray-700' : 'bg-gray-50'}`}>
                                                        <p className={`text-xs ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                                                            {order.items.map((item, i) => (
                                                                <span key={i}>{item.menuItem.emoji} {item.menuItem.name}{item.variant ? ` (${item.variant})` : ''} ×{item.quantity}{i < order.items.length - 1 ? ' • ' : ''}</span>
                                                            ))}

                                                                title="Cancel Order"

                                                                ❌
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                    {selectedItem && <div className="fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-4" onClick={() => setSelectedItem(null)}><div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-3xl p-6 max-w-sm w-full`} onClick={e => e.stopPropagation()}><div className="text-center mb-4"><span className="text-5xl">{selectedItem.emoji}</span><h3 className={`text-xl font-bold mt-2 ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{selectedItem.name}</h3></div><div className="space-y-2 mb-4">{selectedItem.variants.map(v => <button key={v.name} onClick={() => { sounds.click(); setSelectedVariant(v.name); }} className={`w-full p-3 rounded-xl text-left flex justify-between ${selectedVariant === v.name ? 'bg-orange-100 border-2 border-orange-400 text-gray-900' : `${darkMode ? 'bg-gray-700 text-gray-200' : 'bg-gray-50 text-gray-800'} border-2 border-transparent`}`}><span>{v.name}</span><span className="font-bold text-orange-600">${v.price.toFixed(2)}</span></button>)}</div><button onClick={() => addToCart(selectedItem, selectedVariant)} className="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl">Add to Cart 🛒</button></div></div>}

er-t p-4 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}><div className="flex justify-between mb-4"><span className={`text-lg font-bold ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>Total:</span><span className="text-2xl font-bold text-orange-600">${cartTotal.toFixed(2)}</span></div><button onClick={() => { sounds.click(); setShowCart(false); setShowCheckout(true); }} className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold rounded-xl">Proceed to Checkout 💳</button></div></>}</div></div>}
                    {showCheckout && <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={() => setShowCheckout(false)}><div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-3xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto`} onClick={e => e.stopPropagation()}><h2 className={`text-xl font-bold mb-4 ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>📝 Order Details</h2><div className="space-y-4"><div><label className={`text-sm font-medium mb-2 block ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Order Type</label><div className="grid grid-cols-3 gap-2">{['dine-in', 'takeaway', 'delivery'].map(type => <button key={type} onClick={() => { sounds.click(); setOrderType(type); }} className={`p-2 rounded-xl text-sm font-medium ${orderType === type ? 'bg-orange-100 border-2 border-orange-400 text-gray-900' : `${darkMode ? 'bg-gray-700 text-gray-200 border-gray-600' : 'bg-gray-50 text-gray-800 border-transparent'} border-2`}`}>{type === 'dine-in' ? '🪑' : type === 'takeaway' ? '🥡' : '🚗'} {type}</button>)}</div></div><div><label className={`text-sm font-medium mb-1 block ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Customer Name</label><input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Walk-in customer" className={`w-full px-4 py-2 border-2 rounded-xl focus:border-orange-400 outline-none ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'border-gray-200 text-gray-800'}`} /></div><div><label className={`text-sm font-medium mb-1 block ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Phone Number</label><input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="Optional" className={`w-full px-4 py-2 border-2 rounded-xl focus:border-orange-400 outline-none ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'border-gray-200 text-gray-800'}`} /></div>{orderType === 'dine-in' && <div><label className={`text-sm font-medium mb-1 block ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Table Number</label><input type="text" value={tableNumber} onChange={(e) => setTableNumber(e.target.value)} placeholder="e.g., T5" className={`w-full px-4 py-2 border-2 rounded-xl focus:border-orange-400 outline-none ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'border-gray-200 text-gray-800'}`} /></div>}<div><label className={`text-sm font-medium mb-1 block ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Special Notes</label><textarea value={orderNotes} onChange={(e) => setOrderNotes(e.target.value)} placeholder="Any special requests..." className={`w-full px-4 py-2 border-2 rounded-xl focus:border-orange-400 outline-none resize-none h-20 ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'border-gray-200 text-gray-800'}`} /></div><div className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-xl p-3`}><h3 className={`font-medium text-sm mb-2 ${darkMode ? 'text-gray-200' : 'text-gray-800'}`}>📋 Order Summary</h3>{cart.map((item, i) => <div key={i} className={`flex justify-between text-sm py-1 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}><span>{item.menuItem.emoji} {item.menuItem.name}{item.variant ? ` (${item.variant})` : ''} ×{item.quantity}</span><span className="font-medium">${(getItemPrice(item) * item.quantity).toFixed(2)}</span></div>)}<div className={`border-t mt-2 pt-2 flex justify-between font-bold ${darkMode ? 'border-gray-600 text-gray-100' : 'border-gray-200 text-gray-800'}`}><span>Total</span><span className="text-orange-600">${cartTotal.toFixed(2)}</span></div></div><button onClick={handleSubmitOrder} className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold rounded-xl">✅ Place Order</button></div></div></div>}
                </div>
            );
        };

        const OrderHistory = ({ onBack }) => {
            const { darkMode } = useTheme();
            const [orders, setOrders] = useState([]);
            const [filter, setFilter] = useState('all');
            useEffect(() => { loadOrders(); }, []);
            const loadOrders = async () => { const allOrders = await db.getOrders(); setOrders(allOrders.reverse()); };
            const handleStatusChange = async (id, status) => { sounds.click(); await db.updateOrder(id, { status }); await loadOrders(); };
            const handleSync = async () => { sounds.click(); const result = await syncOrders(); sounds.sync(); await loadOrders(); alert(`Synced: ${result.synced} orders. Failed: ${result.failed}`); };
            const filteredOrders = filter === 'all' ? orders : orders.filter(o => o.status === filter);
            const statusColors = { pending: 'bg-yellow-100 text-yellow-700', preparing: 'bg-blue-100 text-blue-700', ready: 'bg-green-100 text-green-700', delivered: 'bg-gray-100 text-gray-600', cancelled: 'bg-red-100 text-red-700' };
            const statusEmojis = { pending: '⏳', preparing: '👨‍🍳', ready: '✅', delivered: '📦', cancelled: '❌' };
            const unsyncedCount = orders.filter(o => !o.synced).length;

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-50'}`}><FloatingBackground /><header className={`shadow-sm border-b sticky top-0 z-20 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}><div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between relative z-10"><div className="flex items-center gap-3"><button onClick={onBack} className={`p-2 rounded-lg ${darkMode ? 'hover:bg-gray-700 text-gray-200' : 'hover:bg-gray-100'}`}>← Back</button><h1 className={`text-xl font-bold ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>📋 Order History</h1></div>{unsyncedCount > 0 && <button onClick={handleSync} className="px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm font-medium">🔄 Sync ({unsyncedCount})</button>}</div></header>
                <div className="max-w-6xl mx-auto px-4 py-4"><div className="flex gap-2 mb-4 flex-wrap">{['all', 'pending', 'preparing', 'ready', 'delivered', 'cancelled'].map(status => <button key={status} onClick={() => { sounds.click(); setFilter(status); }} className={`px-3 py-2 rounded-xl text-sm font-medium ${filter === status ? 'bg-orange-500 text-white' : darkMode ? 'bg-gray-800 border border-gray-700 text-gray-300' : 'bg-white border border-gray-200'}`}>{status === 'all' ? '📋' : statusEmojis[status]} {status.charAt(0).toUpperCase() + status.slice(1)}</button>)}</div>
                <div className="space-y-3 relative z-10">{filteredOrders.length === 0 ? <div className={`text-center py-12 ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}><span className="text-5xl block mb-3">📭</span><p>No orders found</p></div> : filteredOrders.map(order => <div key={order.id} className={`rounded-2xl p-4 shadow-sm border ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'}`}><div className="flex items-start justify-between mb-3"><div><div className="flex items-center gap-2"><span className={`font-bold ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{order.orderId}</span><span className={`px-2 py-0.5 rounded-full text-xs font-medium ${statusColors[order.status]}`}>{statusEmojis[order.status]} {order.status}</span>{!order.synced && <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-600">⏳ Not synced</span>}</div><p className={`text-sm mt-1 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>👤 {order.customerName} • {order.orderType}{order.tableNumber && ` • Table ${order.tableNumber}`}</p></div><div className="text-right"><p className="font-bold text-orange-600 text-lg">${order.total.toFixed(2)}</p><p className={`text-xs ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>{new Date(order.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p></div></div><div className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-xl p-3 mb-3`}>{order.items.map((item, i) => <span key={i} className={`text-sm mr-3 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{item.menuItem.emoji} {item.menuItem.name}{item.variant && ` (${item.variant})`} ×{item.quantity}</span>)}{order.notes && <p className="text-sm text-amber-600 mt-1">📝 {order.notes}</p>}</div><div className="flex gap-2">{order.status === 'pending' && <button onClick={() => handleStatusChange(order.id, 'preparing')} className="px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm font-medium">👨‍🍳 Start Preparing</button>}{order.status === 'preparing' && <button onClick={() => handleStatusChange(order.id, 'ready')} className="px-3 py-1.5 bg-green-500 text-white rounded-lg text-sm font-medium">✅ Mark Ready</button>}{order.status === 'ready' && <button onClick={() => handleStatusChange(order.id, 'delivered')} className="px-3 py-1.5 bg-gray-600 text-white rounded-lg text-sm font-medium">📦 Delivered</button>}{order.status !== 'delivered' && order.status !== 'cancelled' && <button onClick={() => { if (confirm('Cancel this order?')) handleStatusChange(order.id, 'cancelled'); }} className="px-3 py-1.5 bg-red-500 text-white rounded-lg text-sm font-medium">❌ Cancel</button>}</div></div>)}</div></div></div>
            );
        };

        const Dashboard = ({ onBack }) => {
            const { darkMode } = useTheme();

  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);
  
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['Order ID', 'Timestamp', 'Customer Name', 'Phone', 'Order Type', 'Table', 'Items', 'Total', 'Notes', 'Status', 'Staff', 'Last Updated']);
  }
  
  var orderId = data.orderId;
  var allData = sheet.getDataRange().getValues();
  var existingRow = -1;
  var currentStatus = '';
  
  for (var i = 1; i < allData.length; i++) {
    if (allData[i][0] === orderId) {
      existingRow = i + 1;
      currentStatus = allData[i][9];
      break;
    }
  }
  
  if (existingRow > 0 && currentStatus === data.status) {
    return ContentService.createTextOutput(JSON.stringify({status: 'success', message: 'no_change'})).setMimeType(ContentService.MimeType.JSON);
  }
  
  var now = new Date();
  if (existingRow > 0) {
    sheet.getRange(existingRow, 10).setValue(data.status);
    sheet.getRange(existingRow, 12).setValue(now);
  } else {
    sheet.appendRow([data.orderId, new Date(data.timestamp), data.customerName, data.customerPhone, data.orderType, data.tableNumber, data.items, data.total, data.notes, data.status, data.createdBy, now]);
  }
  
  return ContentService.createTextOutput(JSON.stringify({status: 'success'})).setMimeType(ContentService.MimeType.JSON);
}`}</pre></details></div></div>

                        {view === 'order-taking' && <OrderTaking userName={userName} isAdmin={isAdmin} menuItems={menuItems} onViewHistory={() => setView('history')} onViewDashboard={() => setView('dashboard')} onViewSettings={() => setView('settings')} onViewMenu={() => setView('menu')} />}
                        {view === 'history' && <OrderHistory onBack={() => setView('order-taking')} />}
                        {view === 'dashboard' && <Dashboard onBack={() => setView('order-taking')} />}
                        {view === 'settings' && <Settings onBack={() => setView('order-taking')} />}
                        {view === 'menu' && <MenuManagement onBack={() => { setView('order-taking'); loadMenuItems(); }} />}
                    </div>
                </ThemeContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
